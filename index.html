
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Film Assistant V2</title>
<style>
body{font-family:Arial,sans-serif;max-width:1000px;margin:auto;padding:20px}
.card{border:1px solid #ccc;border-radius:8px;padding:15px;margin:12px 0}
input,select,button,textarea{width:100%;padding:8px;margin:5px 0}
#timer{font-size:42px;font-weight:bold}
</style>
</head>
<body>
<h1>Film Assistant V2</h1>

<div class="card">
<h2>Film & Rodinal</h2>
<select id="film"></select>
<select id="dilution">
<option value="25">Rodinal 1+25</option>
<option value="50" selected>Rodinal 1+50</option>
<option value="100">Rodinal 1+100</option>
</select>
<label>Exponerad som ISO</label>
<input id="iso" type="number">
<button onclick="calc()">Beräkna</button>
<div id="result"></div>
</div>

<div class="card">
<h2>Rodinalblandning</h2>
<input id="vol" type="number" value="500">
<button onclick="mix()">Beräkna</button>
<div id="mixout"></div>
</div>

<div class="card">
<h2>Framkallningstimer</h2>
<input id="mins" type="number" value="11">
<button onclick="startTimer()">Start</button>
<div id="timer">Klar</div>
</div>

<div class="card">
<h2>Negativanalys</h2>
<select onchange="analyse(this.value)">
<option>Normal</option>
<option>Tunt negativ</option>
<option>Tätt negativ</option>
</select>
<div id="analysis"></div>
</div>

<div class="card">
<h2>Yashica Mat 80mm Hyperfokal</h2>
<ul>
<li>f/8 ≈ 13 m</li>
<li>f/11 ≈ 9 m</li>
<li>f/16 ≈ 6 m</li>
</ul>
</div>

<div class="card">
<h2>Loggbok</h2>
<textarea id="log" rows="8"></textarea>
<button onclick="saveLog()">Spara</button>
</div>

<script>
const films={
"Kentmere 100":100,"Kentmere 400":400,"HP5+":400,"FP4+":125,
"Delta 100":100,"Delta 400":400,"Pan F 50":50,
"Fomapan 100":100,"Fomapan 200":200,"Fomapan 400":400,
"Tri-X 400":400,"T-Max 100":100,"T-Max 400":400,
"Rollei RPX 25":25,"Rollei RPX 100":100,"Rollei RPX 400":400,
"Adox CHS 100 II":100,"Bergger Pancro 400":400
};

const filmSel=document.getElementById("film");
for(const f in films){
 let o=document.createElement("option");
 o.text=f;
 filmSel.add(o);
}

filmSel.onchange=()=>{
 document.getElementById("iso").value=films[filmSel.value];
};
filmSel.selectedIndex=0;
filmSel.onchange();

function calc(){
 const base=films[filmSel.value];
 const iso=Number(document.getElementById("iso").value);
 const dilution=document.getElementById("dilution").value;

 let baseTime=(dilution=="25")?7:(dilution=="50")?11:18;
 let stops=Math.log2(iso/base);
 let time=baseTime*(1+stops*0.25);

 let msg="Normal exponering.";
 if(stops>0) msg="Push: mer kontrast och korn.";
 if(stops<0) msg="Pull: mer skuggdetalj och mjukare kontrast.";

 document.getElementById("result").innerHTML=
 `<b>Film ISO:</b> ${base}<br>
 <b>Framkallningstid:</b> ${time.toFixed(1)} min<br>
 ${msg}`;

 document.getElementById("mins").value=time.toFixed(1);
}

function mix(){
 let v=Number(document.getElementById("vol").value);
 let r=Number(document.getElementById("dilution").value);
 let rod=v/(r+1);
 let water=v-rod;
 document.getElementById("mixout").innerHTML=
 `Rodinal: ${rod.toFixed(1)} ml<br>Vatten: ${water.toFixed(1)} ml`;
}

let timerInt;
function startTimer(){
 clearInterval(timerInt);
 let sec=Math.round(Number(document.getElementById("mins").value)*60);
 timerInt=setInterval(()=>{
   let m=Math.floor(sec/60);
   let s=sec%60;
   document.getElementById("timer").textContent=
   `${m}:${String(s).padStart(2,"0")}`;
   if(sec===0){
      clearInterval(timerInt);
      alert("Framkallning klar!");
   }
   sec--;
 },1000);
}

function analyse(v){
 let txt="Negativet ser normalt ut.";
 if(v==="Tunt negativ") txt="Öka exponeringen 1/2–1 steg nästa gång.";
 if(v==="Tätt negativ") txt="Minska framkallningstiden ca 10 %.";
 document.getElementById("analysis").innerText=txt;
}

function saveLog(){
 localStorage.setItem("film_log",document.getElementById("log").value);
 alert("Loggbok sparad");
}

document.getElementById("log").value=localStorage.getItem("film_log")||"";
calc(); mix(); analyse("Normal");
</script>
</body>
</html>
